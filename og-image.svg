<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Lightning bolt emoji -->
  <text x="600" y="220" font-size="120" text-anchor="middle">⚡</text>

  <!-- Title -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">EVMath</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="36" fill="white" opacity="0.9" text-anchor="middle">Your home for all EV mathing</text>

  <!-- Description -->
